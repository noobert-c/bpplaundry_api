api:
  name: Packages API
  description: API untuk mengelola data paket laundry, termasuk nama paket, harga per kilogram, dan estimasi pengerjaan.
  format: JSON

  endpoints:
    - name: Get Packages
      method: GET
      path: ""
      description: Mengambil seluruh paket atau satu paket berdasarkan ID.
      auth: none
      query:
        id:
          type: integer
          required: false
          description: ID paket. Jika diisi, hanya mengambil satu paket.
      responses:
        200:
          description: Data paket berhasil diambil.
          all_data:
            success: true
            data:
              - id: 1
                name: "Cuci Reguler"
                price_per_kg: 7000
                est_days: 3
          single_data:
            success: true
            data:
              id: 1
              name: "Cuci Reguler"
              price_per_kg: 7000
              est_days: 3
        400:
          description: ID paket tidak valid.
          body:
            success: false
            message: "ID paket tidak valid"
        404:
          description: Paket tidak ditemukan.
          body:
            success: false
            message: "Paket tidak ditemukan"

    - name: Create Package
      method: POST
      path: ""
      description: Menambahkan paket laundry baru.
      auth: none
      headers:
        Content-Type: application/json
      body:
        name:
          type: string
          required: true
          description: Nama paket, tidak boleh kosong.
        price_per_kg:
          type: number
          required: true
          minimum: 0
          maximum: 99999999.99
          description: Harga layanan per kilogram.
        est_days:
          type: integer
          required: true
          minimum: 1
          description: Estimasi waktu pengerjaan dalam hari.
      responses:
        201:
          description: Paket berhasil ditambahkan.
          body:
            success: true
            message: "Paket berhasil ditambahkan"
            data:
              id: 1
              name: "Cuci Reguler"
              price_per_kg: 7000
              est_days: 3
        400:
          description: JSON atau data tidak valid.
          body:
            success: false
            message: "Nama, harga, atau estimasi hari tidak valid"

    - name: Update Package
      method: PUT
      path: ""
      description: Memperbarui seluruh data paket berdasarkan ID.
      auth: none
      headers:
        Content-Type: application/json
      body:
        id:
          type: integer
          required: true
          minimum: 1
          description: ID paket yang akan diperbarui.
        name:
          type: string
          required: true
          description: Nama paket baru, tidak boleh kosong.
        price_per_kg:
          type: number
          required: true
          minimum: 0
          maximum: 99999999.99
          description: Harga baru per kilogram.
        est_days:
          type: integer
          required: true
          minimum: 1
          description: Estimasi pengerjaan baru dalam hari.
      responses:
        200:
          description: Paket berhasil diperbarui.
          body:
            success: true
            message: "Paket berhasil diperbarui"
            data:
              id: 1
              name: "Cuci Express"
              price_per_kg: 10000
              est_days: 1
        400:
          description: ID atau data paket tidak valid.
          body:
            success: false
            message: "ID, nama, harga, atau estimasi hari tidak valid"
        404:
          description: Paket tidak ditemukan.
          body:
            success: false
            message: "Paket tidak ditemukan"

    - name: Delete Package
      method: DELETE
      path: ""
      description: Menghapus paket berdasarkan ID.
      auth: none
      query:
        id:
          type: integer
          required: true
          description: ID paket yang akan dihapus. Dapat dikirim melalui query atau JSON body.
      body:
        id:
          type: integer
          required: false
          description: Alternatif pengiriman ID jika tidak menggunakan query parameter.
      responses:
        200:
          description: Paket berhasil dihapus.
          body:
            success: true
            message: "Paket berhasil dihapus"
        400:
          description: ID paket tidak valid.
          body:
            success: false
            message: "ID paket tidak valid"
        404:
          description: Paket tidak ditemukan.
          body:
            success: false
            message: "Paket tidak ditemukan"

  general:
    content_type: application/json
    supported_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    cors:
      allow_origin: "*"
      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allow_headers:
        - Content-Type
        - Authorization
    error_responses:
      400:
        description: Request atau data tidak valid.
      405:
        description: Method tidak didukung.
        allowed_methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      500:
        description: Terjadi kesalahan database.

  notes:
    - GET tanpa ID mengembalikan seluruh paket, diurutkan berdasarkan ID terbaru.
    - GET dengan ID mengembalikan satu paket.
    - POST dan PUT memerlukan seluruh field yang didefinisikan pada body.
    - PUT menggunakan ID dari JSON body, bukan query parameter.
    - DELETE menerima ID melalui query parameter atau JSON body; query diprioritaskan jika tersedia.
    - Harga harus berupa angka valid, tidak negatif, dan maksimal 99999999.99.
    - Estimasi pengerjaan harus berupa bilangan bulat minimal 1 hari.
    - OPTIONS digunakan untuk menangani CORS preflight.
    - Tidak ada autentikasi yang diterapkan meskipun header Authorization diizinkan oleh CORS.